###########################################################################################################################################
# !!! The structure of the file should be: 1st object: Main object for interaction, 2nd obj: target (if applicable), then distractors !!! #
###########################################################################################################################################
task:
  type: "DummyTask"
  termination_config: {}
  reward_config: {}

task_type: "put"
strict_place_into: true  # PLACE_INTO by containment and settling, see check_place_inside_condition
instruction: "put the scissors into the mug"

instruction_obj_to_replace: "scissors"
instruction_target_to_replace: "mug"
instruction_verb_to_replace: "put"

supported_scenes:
  IMPACT:
    - "default"

camera_extrinsics:
  cam1: "default"
  cam2: "CP3"

main_objects:
    - type: "USDObject"
      usd_path: "/app/custom_assets/ycb/scissors.usd"
      name: "scissors"
      bounding_box: [0.080, 0.210, 0.020]  # measured real scissors, 70 g
      position: [0.13, 0.0, 0.77]
      orientation: [0, 0, 0, 1]

target_objects:
    - type: "DatasetObject"
      name: "mug"
      category: "mug"
      model: "ycbmug"
      bounding_box: [0.090, 0.115, 0.080]  # in the model's own frame (handle along y); measured real mug
      mass: 1.0  # kg
      position: [-0.10, 0.0, 0.79]
      orientation: [0, 0, -0.7071068, 0.7071068]  # -90 deg about z: handle along +x, as before


distractors: []
immutables: []
